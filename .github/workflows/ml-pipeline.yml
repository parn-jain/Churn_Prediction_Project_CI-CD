name: Machine Learning End-to-End CI/CD Pipeline

# Controls when the workflow will run
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Define the sequence of automated jobs
jobs:
  ci-test-and-build:
    name: CI Test, Train & Docker Build
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the project repository
    - name: Checkout Codebase
      uses: actions/checkout@v3

    # 2. Set up Python environment
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        cache: 'pip' # Automatically caches pip dependencies to make subsequent runs blazing fast!

    # 3. Install dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Generate data and run model registration (to satisfy pytest setup requirements)
    - name: Run Data Generator & Clean pipeline
      run: |
        python data/generate_data.py
        python src/eda.py

    # 5. Run Pytest unit tests
    - name: Run Automated API Tests
      run: |
        pytest app/test_api.py -v

    # 6. Verify full model training pipeline builds without bugs
    - name: Test Model Training & Hyperparameter Tuning
      run: |
        python src/tuning.py
        python src/pipeline_builder.py

    # 7. Set up Docker Buildx (extended Docker capabilities)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    # 11. Build Docker image (CI check to ensure packaging succeeds!)
    - name: Test Build Docker Image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: false # Do not push to registry during standard PR/CI tests
        tags: churn-prediction-api:latest
        cache-from: type=gha # Leverages GitHub Actions cache for ultra-fast builds
        cache-to: type=gha,mode=max

  deploy-to-huggingface:
    name: Continuous Deployment to Hugging Face
    needs: ci-test-and-build
    runs-on: ubuntu-latest
    # Execute ONLY on direct pushes to main/master, not on pull requests!
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
    # 1. Checkout the repository code
    - name: Checkout Codebase
      uses: actions/checkout@v3
      with:
        fetch-depth: 0 # Fetches full history so Git can push changes successfully

    # 2. Push to Hugging Face Spaces Git Remote
    - name: Push Code to Hugging Face Spaces
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Actions"
        
        # 1. Temporarily wipe Git history inside the runner VM
        rm -rf .git
        
        # 2. Re-initialize a fresh Git log and commit current clean files as a single release
        git init
        git checkout -b main
        git add .
        git commit -m "deploy: cloud container release"
        
        # 3. Configure the Hugging Face Spaces Git remote URL securely using our secrets
        git remote add hf https://huggingface.co/spaces/${{ secrets.HF_USERNAME }}/customer-churn-analytics
        
        # 4. Force-push the single clean commit up to Hugging Face Spaces remote
        git push -f https://${{ secrets.HF_USERNAME }}:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/${{ secrets.HF_USERNAME }}/customer-churn-analytics main
